components:
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "admin@example.com"
        password:
          type: string
          format: password
          example: "Admin@12345"

    SetPasswordRequest:
      type: object
      required:
        - email
        - newPassword
        - confirmPassword
      properties:
        email:
          type: string
          example: "abc@example.com"
        newPassword:
          type: string
          format: password
          example: "StrongPass@2026"
        confirmPassword:
          type: string
          format: password
          example: "StrongPass@2026"

    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
        - confirmPassword
      properties:
        currentPassword:
          type: string
          format: password
          example: "OldPass@2026"
        newPassword:
          type: string
          format: password
          example: "NewPass@2026"
        confirmPassword:
          type: string
          format: password
          example: "NewPass@2026"

    AuthData:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        accessToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    AuthResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/AuthData"
        status:
          $ref: "#/components/schemas/ResponseStatus"

    MessageResponse:
      type: object
      properties:
        data:
          nullable: true
          example: null
        status:
          $ref: "#/components/schemas/ResponseStatus"

paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: "User login"
      description: "Authenticates with email and password, issuing access and refresh tokens. Returns 403 if password is not set or account is inactive."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "Authentication successful"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: "Validation error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Invalid email or password"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - PASSWORD_NOT_SET or ACCOUNT_INACTIVE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/set-password:
    post:
      tags:
        - Auth
      summary: "First-login set password"
      description: "Sets the initial password using the one-time 48h setup token received by the user."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPasswordRequest"
      responses:
        "200":
          description: "Password set successfully, session tokens returned"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: "Invalid or expired token, password mismatch, or weak password"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/change-password:
    post:
      tags:
        - Auth
      summary: "Change password"
      description: "Changes the authenticated user's password, updates passwordChangedAt, and invalidates active refresh tokens."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: "Password changed successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: "Invalid current password, mismatch, or new password same as current"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized - Token missing or expired"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - Password not yet set"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      tags:
        - Auth
      summary: "Get current user profile"
      description: "Returns currently authenticated user profile from JWT Bearer token."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Current user profile"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSingleResponse"
        "401":
          description: "Unauthorized - Token missing or expired"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "User not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      tags:
        - Auth
      summary: "User logout"
      description: "Invalidates the user's refresh token and clears active session."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Logged out successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
