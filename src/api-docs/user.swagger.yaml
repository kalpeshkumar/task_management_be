components:
  schemas:
    UserRole:
      type: string
      enum: [ADMIN, USER]
      example: "ADMIN"

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Admin User"
        email:
          type: string
          format: email
          example: "admin@example.com"
        role:
          $ref: "#/components/schemas/UserRole"
        isPasswordSet:
          type: boolean
          example: false
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-11-09T08:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-11-09T08:00:00.000Z"

    CreateUserInput:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        role:
          $ref: "#/components/schemas/UserRole"

    CreateUserData:
      type: object
      properties:
        id:
          type: integer
          example: 2
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        role:
          $ref: "#/components/schemas/UserRole"
        isPasswordSet:
          type: boolean
          example: false
        isActive:
          type: boolean
          example: true
        setupToken:
          type: string
          example: "4d9f67a21f729b82736183e8fa..."
        setupExpires:
          type: string
          format: date-time
          example: "2026-11-11T08:00:00.000Z"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateUserResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/CreateUserData"
        status:
          $ref: "#/components/schemas/ResponseStatus"

    ResendSetupTokenData:
      type: object
      properties:
        userId:
          type: integer
          example: 2
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        setupToken:
          type: string
          example: "4d9f67a21f729b82736183e8fa..."
        setupExpires:
          type: string
          format: date-time
          example: "2026-11-11T08:00:00.000Z"

    ResendSetupTokenResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/ResendSetupTokenData"
        status:
          $ref: "#/components/schemas/ResponseStatus"

    UpdateUserInput:
      type: object
      properties:
        name:
          type: string
          example: "John Updated"
        email:
          type: string
          format: email
          example: "john.updated@example.com"
        role:
          $ref: "#/components/schemas/UserRole"

    UserFilterCriteria:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
          example: [1, 2, 3]
        emails:
          type: array
          items:
            type: string
          example: ["admin@example.com"]
        roles:
          type: array
          items:
            $ref: "#/components/schemas/UserRole"
        search:
          type: string
          example: "John"
        createdAt:
          $ref: "#/components/schemas/DateRangeInput"
        updatedAt:
          $ref: "#/components/schemas/DateRangeInput"

    UserFilterRequest:
      type: object
      properties:
        filter:
          $ref: "#/components/schemas/UserFilterCriteria"
        sort:
          $ref: "#/components/schemas/SortInput"

    UserPaginationRequest:
      type: object
      properties:
        filter:
          $ref: "#/components/schemas/UserFilterCriteria"
        page:
          $ref: "#/components/schemas/PaginationInput"
        sort:
          $ref: "#/components/schemas/SortInput"

    UserSingleResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/User"
        status:
          $ref: "#/components/schemas/ResponseStatus"

    UserListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        sort:
          $ref: "#/components/schemas/SortInput"
        status:
          $ref: "#/components/schemas/ResponseStatus"

    UserPaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
        sort:
          $ref: "#/components/schemas/SortInput"
        status:
          $ref: "#/components/schemas/ResponseStatus"

paths:
  /user/add:
    post:
      tags:
        - Users
      summary: "Add a new user"
      description: "Creates a new user with password=null and generates a one-time setup token (48h expiry) for first-login password setup. Password is NOT passed in request body. Requires ADMIN role."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
      responses:
        "200":
          description: "User created successfully with setup token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUserResponse"
        "400":
          description: "Invalid input or validation error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized - Token missing or expired"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - Requires ADMIN role"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/{userId}/resend-setup-token:
    post:
      tags:
        - Users
      summary: "Resend password setup token"
      description: "Generates a new 48-hour password setup token for a user whose initial password has not yet been set. Requires ADMIN role."
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: "Numeric user ID"
          schema:
            type: integer
            example: 2
      responses:
        "200":
          description: "Setup token regenerated successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendSetupTokenResponse"
        "400":
          description: "Password already set or invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized - Token missing or expired"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden - Requires ADMIN role"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "User not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/{userId}:
    get:
      tags:
        - Users
      summary: "Get user by ID"
      description: "Retrieves user profile details by ID. Requires ADMIN role."
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
          description: "Numeric user ID"
      responses:
        "200":
          description: "User found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSingleResponse"
        "400":
          description: "Invalid user ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "User not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      tags:
        - Users
      summary: "Update user by ID"
      description: "Updates an existing user record. Requires ADMIN role."
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
          description: "Numeric user ID to update"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "200":
          description: "User updated successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSingleResponse"
        "400":
          description: "Invalid request payload"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "User not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags:
        - Users
      summary: "Delete user by ID"
      description: "Deletes a user record by ID. Requires ADMIN role."
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
          description: "Numeric user ID to delete"
      responses:
        "200":
          description: "User deleted successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSingleResponse"
        "400":
          description: "Invalid user ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "User not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/filter:
    post:
      tags:
        - Users
      summary: "Filter users without pagination"
      description: "Retrieves list of users matching query filter and sorting. Requires ADMIN role."
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserFilterRequest"
      responses:
        "200":
          description: "Users list retrieved"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "400":
          description: "Invalid filter parameters"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/filter/paginated:
    post:
      tags:
        - Users
      summary: "Filter users with pagination"
      description: "Retrieves paginated list of users matching filter, page, and sorting. Requires ADMIN role."
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPaginationRequest"
      responses:
        "200":
          description: "Paginated users retrieved successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPaginatedResponse"
        "400":
          description: "Invalid pagination or filter parameters"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

